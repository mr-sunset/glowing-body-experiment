<!DOCTYPE html>

<html lang="en">
    <head>
        <title>Glowing body experiment</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            :root {
                --shadow-color: #0099ff;
                --secondary-shadow-color: #b700ff7b;
            }

            @keyframes pulse {
                0% {
                    box-shadow: inset 0 0 20px 4px var(--shadow-color),
                        inset 0 0 50px 10px var(--secondary-shadow-color);
                }

                50% {
                    box-shadow: inset 0 0 10px 2px var(--shadow-color),
                        inset 0 0 25px 5px var(--secondary-shadow-color);
                }

                100% {
                    box-shadow: inset 0 0 20px 4px var(--shadow-color),
                        inset 0 0 50px 10px var(--secondary-shadow-color);
                }
            }

            body {
                background-color: rgb(20, 20, 20);
                height: 100vh;
                margin: 0;

                animation: pulse 5s infinite ease;
            }
        </style>
    </head>

    <body>
        
    </body>
</html>
